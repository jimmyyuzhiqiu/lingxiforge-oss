    <script>
        (function () {
            var THEME_KEY = "theme-glass";
            var LEGACY_KEY = "theme";
            try {
                var stored = localStorage.getItem(THEME_KEY) || localStorage.getItem(LEGACY_KEY);
                var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                var next = (stored === "light" || stored === "dark")
                    ? stored
                    : (prefersDark ? "dark" : "light");
                document.documentElement.setAttribute("theme", next);
                if (stored && !localStorage.getItem(THEME_KEY)) {
                    localStorage.setItem(THEME_KEY, stored);
                    localStorage.removeItem(LEGACY_KEY);
                }
            } catch (e) {
                document.documentElement.setAttribute("theme", "light");
            }
        })();
    </script>
    <script>
        (function () {
            var lowBandwidth = false;
            try {
                var connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                var effectiveType = (connection && connection.effectiveType ? connection.effectiveType : "").toLowerCase();
                lowBandwidth = !!(connection && connection.saveData) || /(^|-)2g|3g/.test(effectiveType);
            } catch (e) {
                lowBandwidth = false;
            }

            if (lowBandwidth) return;

            var assets = [
                "/ai/landing/patterns/wave-pattern.svg",
                "/ai/landing/patterns/signal-ring.svg",
                "/ai/landing/patterns/stone-texture.svg",
                "/ai/landing/patterns/bronze-corner.svg"
            ];

            var appendPrefetch = function () {
                assets.forEach(function (href) {
                    if (document.head.querySelector('link[rel="prefetch"][href="' + href + '"]')) return;
                    var link = document.createElement("link");
                    link.rel = "prefetch";
                    link.href = href;
                    link.as = "image";
                    link.type = "image/svg+xml";
                    document.head.appendChild(link);
                });
            };

            var idle = window.requestIdleCallback;
            if (typeof idle === "function") {
                idle(appendPrefetch, { timeout: 1800 });
                return;
            }
            window.setTimeout(appendPrefetch, 900);
        })();
    </script>
