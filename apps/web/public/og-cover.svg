<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020" />
      <stop offset="0.55" stop-color="#0F172A" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(280 160) rotate(35) scale(420 320)">
      <stop stop-color="#60A5FA" stop-opacity="0.55" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(860 220) rotate(25) scale(520 420)">
      <stop stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(620 520) rotate(-12) scale(560 360)">
      <stop stop-color="#2DD4BF" stop-opacity="0.45" />
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g filter="url(#blur)">
    <ellipse cx="280" cy="160" rx="420" ry="320" fill="url(#orb1)" />
    <ellipse cx="860" cy="220" rx="520" ry="420" fill="url(#orb2)" />
    <ellipse cx="620" cy="520" rx="560" ry="360" fill="url(#orb3)" />
  </g>

  <g opacity="0.96">
    <text x="110" y="290" fill="#E2E8F0" font-size="84" font-weight="800"
      font-family="Space Grotesk, Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      Lingxi Forge
    </text>
    <text x="110" y="356" fill="#A5B4FC" font-size="28" font-weight="600"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      AI + 3D 文创赋能平台
    </text>
    <text x="110" y="404" fill="#94A3B8" font-size="18" font-weight="500"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      从文/图输入到可制造网格优化，再到 3D 打印履约交付
    </text>
  </g>
</svg>

